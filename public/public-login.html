<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Public Login Selection - Botswana Schools Portal</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      .login-choice-grid {
        display: grid;
        gap: 15px;
        margin-top: 20px;
      }
      .login-choice-btn {
        display: block;
        width: 100%;
        padding: 12px;
        background-color: #006633;
        color: white;
        text-align: center;
        text-decoration: none;
        border-radius: 4px;
        font-size: 16px;
      }
      .login-choice-btn:hover {
        background-color: #004d26;
      }
    </style>
  </head>
  <body>
    <div class="container" style="max-width: 450px">
      <h2>Select Login Portal</h2>
      <p style="text-align: center; color: #666">
        Choose how you want to log in:
      </p>

      <div class="login-choice-grid">
        <a href="student-login.html" class="login-choice-btn"
          >Login as Student</a
        >
        <a href="parent-login.html" class="login-choice-btn">Login as Parent</a>
      </div>

      <p class="auth-switch" style="margin-top: 20px">
        <a href="index.html">Back to Home</a>
      </p>
    </div>
  </body>
</html>
