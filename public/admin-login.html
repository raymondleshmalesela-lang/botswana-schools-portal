<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Staff Registration & Login - Botswana Schools Portal</title>
    <!-- Add your CSS stylesheets here -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h2>Staff Registration Portal</h2>

      <!-- Registration Form -->
      <form id="registerForm">
        <div class="form-group">
          <label>Full Name:</label>
          <input
            type="text"
            name="full_name"
            required
            placeholder="e.g. Mompati Tau"
          />
        </div>

        <div class="form-group">
          <label>Email Address:</label>
          <input
            type="email"
            name="email"
            required
            placeholder="e.g. mompati@gov.bw"
          />
        </div>

        <div class="form-group">
          <label>Password:</label>
          <input
            type="password"
            name="password"
            required
            placeholder="Create secure password"
          />
        </div>

        <div class="form-group">
          <label>Staff Role:</label>
          <select name="staff_role" required>
            <option value="Teacher">Teacher</option>
            <option value="Administrator">Administrator</option>
          </select>
        </div>

        <!-- Teaching Level (Triggers the dynamic dropdowns) -->
        <div class="form-group">
          <label>Teaching Level:</label>
          <select name="teaching_level" id="teachingLevel" required>
            <option value="">-- Select Teaching Level --</option>
            <option value="Primary Level">Primary Level</option>
            <option value="Secondary Level">Secondary Level</option>
          </select>
        </div>

        <!-- Assigned School Placement (Populated dynamically) -->
        <div class="form-group">
          <label>Assigned School Placement:</label>
          <select
            name="school_placement"
            id="schoolPlacement"
            disabled
            required
          >
            <option value="">-- Select Level First --</option>
          </select>
        </div>

        <!-- Subjects Taught (Populated dynamically via checkboxes) -->
        <div class="form-group">
          <label>Subjects Taught (Select all that apply):</label>
          <div
            id="subjects-box"
            style="
              border: 1px solid #ccc;
              padding: 10px;
              border-radius: 4px;
              max-height: 150px;
              overflow-y: auto;
            "
          >
            <span style="color: #777">Select teaching level first</span>
          </div>
        </div>

        <button type="submit" class="btn-submit">Register Staff Account</button>
      </form>

      <p class="auth-switch">
        Already registered? <a href="login.html">Login here</a>
      </p>
    </div>

    <!-- External JavaScript File -->
    <script src="script.js"></script>
  </body>
</html>
