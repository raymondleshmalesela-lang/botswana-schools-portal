<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Internal Staff Admin Portal - Botswana Schools Portal</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f4f6f9;
        margin: 0;
        padding: 0;
      }
      header {
        background-color: #006633;
        color: white;
        padding: 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .container {
        max-width: 500px;
        margin: 40px auto;
        padding: 20px;
      }
      .card {
        background: white;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        margin-bottom: 20px;
      }
      h3 {
        color: #006633;
        margin-top: 0;
        border-bottom: 2px solid #eee;
        padding-bottom: 10px;
      }
      label {
        display: block;
        margin-top: 10px;
        font-weight: bold;
        font-size: 14px;
        color: #333;
      }
      input,
      select,
      textarea {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        margin-bottom: 15px;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box;
      }
      button {
        background-color: #006633;
        color: white;
        border: none;
        padding: 12px;
        width: 100%;
        border-radius: 4px;
        font-weight: bold;
        cursor: pointer;
      }
      button:hover {
        background-color: #004d26;
      }
      .checkbox-group {
        max-height: 150px;
        overflow-y: auto;
        border: 1px solid #ccc;
        padding: 10px;
        border-radius: 4px;
        margin-top: 5px;
        margin-bottom: 15px;
        background: #fff;
      }
      .checkbox-item {
        display: flex;
        align-items: center;
        margin-bottom: 5px;
      }
      .checkbox-item input {
        width: auto;
        margin-right: 10px;
        margin-bottom: 0;
      }
      .switch-link {
        text-align: center;
        margin-top: 15px;
        font-size: 14px;
      }
      .switch-link a {
        color: #006633;
        text-decoration: none;
        font-weight: bold;
      }
      .switch-link a:hover {
        text-decoration: underline;
      }
      .error-msg {
        color: #d9534f;
        font-size: 14px;
        margin-bottom: 10px;
        text-align: center;
      }
      .success-msg {
        color: #5cb85c;
        font-size: 14px;
        margin-bottom: 10px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <header>
      <h2>Staff Admin & Management Portal</h2>
      <div>
        <a href="index.html" style="color: white; text-decoration: underline"
          >Public Citizen Portal</a
        >
      </div>
    </header>

    <div class="container">
      <!-- Login Card -->
      <div class="card" id="loginCard">
        <h3>Staff Login</h3>
        <div id="adminLoginMsg" class="error-msg"></div>
        <form id="adminLoginForm">
          <label>Email Address:</label>
          <input
            type="email"
            id="adminEmail"
            placeholder="e.g. staff@gov.bw"
            required
          />

          <label>Password:</label>
          <input
            type="password"
            id="adminPassword"
            placeholder="Enter password"
            required
          />

          <button type="submit">Log In to Staff Portal</button>
        </form>
        <div class="switch-link">
          Don't have a staff account?
          <a href="#" onclick="toggleAuthForms()">Register new staff account</a>
        </div>
      </div>

      <!-- Registration Card -->
      <div class="card" id="registerCard" style="display: none">
        <h3>Staff Registration</h3>
        <div id="adminRegMsg"></div>
        <form id="adminRegisterForm">
          <label>Full Name:</label>
          <input
            type="text"
            id="regName"
            placeholder="e.g. Mompati Tau"
            required
          />

          <label>Email Address:</label>
          <input
            type="email"
            id="regEmail"
            placeholder="e.g. mompati@gov.bw"
            required
          />

          <label>Password:</label>
          <input
            type="password"
            id="regPassword"
            placeholder="Create secure password"
            required
          />

          <label>Staff Role:</label>
          <select id="regRole" required>
            <option value="teacher">Teacher</option>
            <option value="head_teacher">Head Teacher</option>
            <option value="regional_admin">Regional Administrator</option>
            <option value="ministry_official">Ministry Official</option>
          </select>

          <label>Teaching Level:</label>
          <select id="regLevel" onchange="updateSubjectsAndSchools()" required>
            <option value="">-- Select Education Level --</option>
            <option value="primary">Primary Level</option>
            <option value="secondary">Secondary Level</option>
          </select>

          <label>Assigned School Placement:</label>
          <select id="regSchool" required>
            <option value="">-- Select Level First --</option>
          </select>

          <label>Subjects Taught (Select all that apply):</label>
          <div class="checkbox-group" id="subjectCheckboxes">
            <small style="color: #666">Select teaching level first</small>
          </div>

          <button type="submit">Register Staff Account</button>
        </form>
        <div class="switch-link">
          Already registered?
          <a href="#" onclick="toggleAuthForms()">Login here</a>
        </div>
      </div>
    </div>
    <!-- Link to  external script file -->
    <script src="script.js"></script>
  </body>
</html>
