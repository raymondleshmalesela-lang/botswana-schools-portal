<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Select Pre-School Class - Botswana Schools Portal</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h2>Select Pre-School Class</h2>
      <p style="text-align: center; color: #666">
        Choose an available class seat configured by the school administration:
      </p>

      <div id="classList" style="margin: 20px 0">
        <p>Loading available classes...</p>
      </div>

      <button
        type="button"
        class="btn-submit"
        onclick="confirmEnrollment()"
        id="confirmBtn"
        style="display: none"
      >
        Confirm & Register
      </button>
      <p class="auth-switch" style="margin-top: 15px">
        <a href="parent-registration.html">Back</a>
      </p>
    </div>

    <script>
      let selectedClassId = null;

      async function loadClasses() {
        try {
          const res = await fetch("/api/preschool-classes");
          const classes = await res.json();

          const container = document.getElementById("classList");
          if (classes.length === 0) {
            container.innerHTML =
              '<p style="text-align:center; color:red;">No pre-school classes are currently open for registration.</p>';
            return;
          }

          container.innerHTML = "";
          classes.forEach((cls) => {
            const div = document.createElement("div");
            div.style.cssText =
              "border: 1px solid #ccc; padding: 12px; margin-bottom: 10px; border-radius: 5px; cursor: pointer; display: flex; justify-content: space-between; align-items: center;";
            div.innerHTML = `<span><strong>${cls.class_name}</strong></span> <span>{${cls.enrolled_count}/${cls.max_capacity}} seats</span>`;

            div.onclick = () => {
              document
                .querySelectorAll("#classList div")
                .forEach((d) => (d.style.background = "white"));
              div.style.background = "#e6f4ea";
              selectedClassId = cls.id;
              document.getElementById("confirmBtn").style.display = "block";
            };
            container.appendChild(div);
          });
        } catch (err) {
          console.error(err);
          document.getElementById("classList").innerHTML =
            '<p style="color:red;">Error loading classes.</p>';
        }
      }

      async function confirmEnrollment() {
        if (!selectedClassId) return alert("Please select a class first.");

        const parentData = JSON.parse(sessionStorage.getItem("pendingParent"));
        if (!parentData) {
          alert("Session expired. Please restart registration.");
          window.location.href = "parent-registration.html";
          return;
        }

        const payload = { ...parentData, class_id: selectedClassId };

        try {
          const response = await fetch("/api/parent-register-preschool", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });

          const result = await response.json();
          if (response.ok) {
            alert("Pre-school registration completed successfully!");
            sessionStorage.removeItem("pendingParent");
            window.location.href = "/index.html";
          } else {
            alert("Error: " + (result.error || "Registration failed"));
          }
        } catch (err) {
          console.error(err);
          alert("Network error during confirmation.");
        }
      }

      loadClasses();
    </script>
  </body>
</html>
