<div
  class="container"
  style="margin-top: 30px; background: #fff; padding: 20px; border-radius: 8px"
>
  <h3>Administrator Staff Management</h3>
  <p>Create and provision new Staff accounts (Teachers or Headteachers):</p>

  <form id="adminCreateStaffForm">
    <div class="form-group">
      <label>Full Name:</label>
      <input
        type="text"
        id="staffName"
        required
        placeholder="e.g. Kagiso Mpho"
      />
    </div>

    <div class="form-group">
      <label>Identifier (Email or Staff ID):</label>
      <input
        type="text"
        id="staffIdentifier"
        required
        placeholder="e.g. teacher1@schools.gov.bw"
      />
    </div>

    <div class="form-group">
      <label>Temporary Password:</label>
      <input
        type="password"
        id="staffPassword"
        required
        placeholder="Assign password"
      />
    </div>

    <div class="form-group">
      <label>Staff Role:</label>
      <select id="staffRole" required>
        <option value="teacher">Teacher</option>
        <option value="headteacher">Head Teacher</option>
      </select>
    </div>

    <button type="submit" class="btn-submit">Create Staff Account</button>
  </form>
</div>

<script>
  document
    .getElementById("adminCreateStaffForm")
    .addEventListener("submit", async (e) => {
      e.preventDefault();

      const full_name = document.getElementById("staffName").value;
      const identifier = document.getElementById("staffIdentifier").value;
      const password = document.getElementById("staffPassword").value;
      const role = document.getElementById("staffRole").value;

      try {
        const response = await fetch("/api/admin/create-staff", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ full_name, identifier, password, role }),
        });

        const result = await response.json();

        if (response.ok) {
          alert("Staff account created successfully!");
          document.getElementById("adminCreateStaffForm").reset();
        } else {
          alert("Failed to create staff: " + (result.error || "Unknown error"));
        }
      } catch (err) {
        console.error("Error creating staff:", err);
        alert("Network error while processing staff creation.");
      }
    });
</script>
