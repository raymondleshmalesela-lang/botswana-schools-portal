<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Parent Registration - Botswana Schools Portal</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container" id="formContainer">
      <h2>Parent / Guardian Registration</h2>

      <form id="parentRegisterForm">
        <div class="form-group">
          <label>Full Name:</label>
          <input
            type="text"
            name="full_name"
            required
            placeholder="e.g. Mompati Smarts"
          />
        </div>

        <div class="form-group">
          <label>National ID / Omang Number or Phone:</label>
          <input
            type="text"
            name="identifier"
            required
            placeholder="e.g. 123456789 or Phone"
          />
        </div>

        <div class="form-group">
          <label>Password:</label>
          <input
            type="password"
            name="password"
            required
            placeholder="Create password"
          />
        </div>

        <div class="form-group">
          <label>Registration Type:</label>
          <select id="regType" required onchange="toggleChildInput()">
            <option value="existing">Link Existing Student ID</option>
            <option value="preschool">
              New Pre-School Admission (Starting School)
            </option>
          </select>
        </div>

        <div class="form-group" id="existingChildGroup">
          <label>Child's National ID (To Link Account):</label>
          <input
            type="text"
            name="child_national_id"
            id="child_national_id"
            placeholder="Enter student's National ID"
          />
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">
          Register Parent Account
        </button>
      </form>

      <p class="auth-switch">
        Already registered? <a href="public-login.html">Login here</a>
      </p>
      <p class="auth-switch" style="margin-top: 10px">
        <a href="index.html">Back to Home</a>
      </p>
    </div>

    <script>
      function toggleChildInput() {
        const regType = document.getElementById("regType").value;
        const existingGroup = document.getElementById("existingChildGroup");
        const childInput = document.getElementById("child_national_id");
        const submitBtn = document.getElementById("submitBtn");

        if (regType === "preschool") {
          existingGroup.style.display = "none";
          childInput.removeAttribute("required");
          submitBtn.textContent = "Next: Choose Pre-School Class";
        } else {
          existingGroup.style.display = "block";
          childInput.setAttribute("required", "true");
          submitBtn.textContent = "Register Parent Account";
        }
      }

      document
        .getElementById("parentRegisterForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const regType = document.getElementById("regType").value;
          const formData = new FormData(e.target);
          const data = Object.fromEntries(formData.entries());

          if (regType === "preschool") {
            // Save basic parent info temporarily and proceed to seat selection page
            sessionStorage.setItem("pendingParent", JSON.stringify(data));
            window.location.href = "/preschool-selection.html";
            return;
          }

          try {
            const response = await fetch("/api/parent-register", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(data),
            });

            const result = await response.json();

            if (response.ok) {
              alert("Parent registered successfully!");
              window.location.href = "/index.html";
            } else {
              alert(
                "Registration failed: " + (result.error || "Unknown error"),
              );
            }
          } catch (err) {
            console.error("Registration error:", err);
            alert("Network error while registering parent.");
          }
        });
    </script>
  </body>
</html>
