<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Registration - Botswana Schools Portal</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h2>Student Registration</h2>

      <form id="studentRegisterForm">
        <div class="form-group">
          <label>National ID / Omang Number:</label>
          <input
            type="text"
            name="national_id"
            required
            placeholder="e.g. 098765432"
          />
        </div>

        <div class="form-group">
          <label>Full Name:</label>
          <input
            type="text"
            name="full_name"
            required
            placeholder="e.g. Maduo Smarts"
          />
        </div>

        <div class="form-group">
          <label>Password:</label>
          <input
            type="password"
            name="password"
            required
            placeholder="Create password"
          />
        </div>

        <!-- Grade / Form Level (Triggers student-script.js) -->
        <div class="form-group">
          <label>Grade / Form Level:</label>
          <select name="grade_level" id="gradeLevel" required>
            <option value="">-- Select Grade Level --</option>
            <option value="Primary Level">Primary Level</option>
            <option value="Secondary Level">Secondary Level</option>
          </select>
        </div>

        <!-- Assigned School Placement (Populated dynamically) -->
        <div class="form-group">
          <label>Select School:</label>
          <select
            name="school_placement"
            id="schoolPlacement"
            disabled
            required
          >
            <option value="">-- Select Grade Level First --</option>
          </select>
        </div>

        <div class="form-group">
          <label>Academic Term:</label>
          <select name="academic_term" required>
            <option value="Term 1">Term 1</option>
            <option value="Term 2">Term 2</option>
            <option value="Term 3">Term 3</option>
          </select>
        </div>

        <!-- Subjects to Register (Populated dynamically via checkboxes) -->
        <div class="form-group">
          <label>Subjects to Register (Select all that apply):</label>
          <div
            id="student-subjects-box"
            style="
              border: 1px solid #ccc;
              padding: 10px;
              border-radius: 4px;
              max-height: 150px;
              overflow-y: auto;
              background-color: #fafafa;
            "
          >
            <span style="color: #777">Select grade level first</span>
          </div>
        </div>

        <button type="submit" class="btn-submit">
          Register Citizen Account
        </button>
      </form>

      <p class="auth-switch">
        Already registered? <a href="login.html">Login here</a>
      </p>
    </div>

    <!-- Dedicated Student Script File -->
    <script src="student-script.js"></script>
  </body>
</html>
