<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Botswana Schools Portal - Home</title>
  </head>
  <body>
    <div
      style="
        max-width: 600px;
        margin: 40px auto;
        font-family: Arial, sans-serif;
        padding: 20px;
      "
    >
      <h2>Botswana Schools Portal</h2>
      <p>Select your portal to continue:</p>

      <div
        style="
          border: 1px solid #ccc;
          padding: 20px;
          margin-bottom: 20px;
          border-radius: 5px;
        "
      >
        <h3>Student & Parent Portal</h3>
        <p>Access registrations and portal logins.</p>
        <div
          style="display: flex; gap: 10px; flex-wrap: wrap; margin-top: 15px"
        >
          <a
            href="public-login.html"
            style="
              padding: 8px 15px;
              background: #006633;
              color: white;
              text-decoration: none;
              border-radius: 4px;
            "
            >Login</a
          >
          <a
            href="student-registration.html"
            style="
              padding: 8px 15px;
              background: #006633;
              color: white;
              text-decoration: none;
              border-radius: 4px;
            "
            >Student Register</a
          >
          <a
            href="parent-registration.html"
            style="
              padding: 8px 15px;
              background: #006633;
              color: white;
              text-decoration: none;
              border-radius: 4px;
            "
            >Parent Register</a
          >
        </div>
      </div>

      <div style="border: 1px solid #ccc; padding: 20px; border-radius: 5px">
        <h3>Internal Staff & Admin Portal</h3>
        <p>Access teacher workspaces, dashboards, and administration tools.</p>
        <div style="margin-top: 15px">
          <a
            href="admin-login.html"
            style="
              padding: 8px 15px;
              background: #006633;
              color: white;
              text-decoration: none;
              border-radius: 4px;
            "
            >Staff Login</a
          >
        </div>
      </div>
    </div>
  </body>
</html>
